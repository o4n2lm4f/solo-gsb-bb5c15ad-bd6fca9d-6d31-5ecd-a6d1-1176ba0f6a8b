services:
  capability-api:
    build: .
    image: capability-token-api:latest
    container_name: capability-token-api
    ports:
      - "8000:8000"
    environment:
      # Ordered key ring: comma-separated kid:secret entries; the FIRST one
      # signs new tokens and every entry verifies. Rotate by prepending the
      # new key and keeping the old one until all old tokens have expired,
      # then remove the old entry. A default dev key ships in .env.example so
      # the stack runs out of the box — change it for real use.
      CAPABILITY_KEYRING: ${CAPABILITY_KEYRING:-dev:dev-insecure-secret-change-me-0123456789}
      # Optional key that verifies only tokens issued before key-ring support
      # (they carry no kid). Empty = kid-less tokens are rejected 401.
      CAPABILITY_LEGACY_SECRET: ${CAPABILITY_LEGACY_SECRET:-}
      CAPABILITY_ISSUER_KEY: ${CAPABILITY_ISSUER_KEY:-}
      CAPABILITY_ADMIN_KEY: ${CAPABILITY_ADMIN_KEY:-}
      CAPABILITY_DB_PATH: /data/capabilities.db
      CAPABILITY_FILES_DIR: /app/files
      CAPABILITY_DEFAULT_TTL: ${CAPABILITY_DEFAULT_TTL:-300}
      CAPABILITY_MAX_TTL: ${CAPABILITY_MAX_TTL:-3600}
    volumes:
      - capability-data:/data
      - ./files:/app/files:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  capability-data:
